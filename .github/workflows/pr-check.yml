name: PR Check

on:
  pull_request:
    branches: [develop, master]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verificar se a versão mudou
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          git fetch origin "${{ github.base_ref }}"
          git show "origin/${{ github.base_ref }}:package.json" > /tmp/base-package.json
          BASE_VERSION=$(node -p "require('/tmp/base-package.json').version")

          echo "Base (${{ github.base_ref }}): $BASE_VERSION"
          echo "PR: $NEW_VERSION"

          if [ "$NEW_VERSION" = "$BASE_VERSION" ]; then
            echo "::error::A versão no package.json não mudou ($BASE_VERSION). Suba a versão antes de mergear."
            exit 1
          fi

      - name: Instalar dependências
        run: npm ci

      - name: Build de validação
        run: npx ng build --configuration development
